<!DOCTYPE html>
<html>
<head>
    <title>Test Cloud Sync</title>
</head>
<body>
    <h1>Test Cloud Connection</h1>
    <button onclick="testConnection()">Test Connection</button>
    <pre id="result"></pre>

    <script>
        const SCRIPT_ID = 'AKfycbwVX6yC9KfnntFjAEsNjPeZ_V8zDHfHczsynEwG2WCiYO0upWg57ygATDpgHxzXr8g21w';
        const WEB_APP_URL = `https://script.google.com/macros/s/${SCRIPT_ID}/exec`;
        
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing connection...\n';
            
            try {
                // Test 1: Check if Apps Script is reachable
                const testUrl = `${WEB_APP_URL}?action=test`;
                const response = await fetch(testUrl);
                const text = await response.text();
                resultDiv.innerHTML += `✅ Apps Script responded!\nResponse: ${text}\n\n`;
            } catch(error) {
                resultDiv.innerHTML += `❌ Connection failed: ${error.message}\n`;
            }
            
            // Test 2: Try to register a test account
            try {
                const testUsername = 'testuser_' + Date.now();
                const url = `${WEB_APP_URL}?action=register&username=${testUsername}&password=test123`;
                const response = await fetch(url);
                const data = await response.json();
                resultDiv.innerHTML += `✅ Register test: ${JSON.stringify(data)}\n`;
            } catch(error) {
                resultDiv.innerHTML += `❌ Register failed: ${error.message}\n`;
            }
        }
    </script>
</body>
</html>
